<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Regina Fröhlich · Artist</title>
<meta name="description" content="Regina Fröhlich — Artist · Abstract Painting">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400;600;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#000000;
    --muted:#5e5e5e;
    --bg:#ffffff;
  }


  *{ box-sizing:border-box; }


  html,body{
    margin:0;
    padding:0;
    background:var(--bg);
    color:var(--ink);
    height:100%;
  }


  body{
    display:flex;
    align-items:center;
    min-height:100vh;
    font-family:'Gabarito', sans-serif;
  }


  main{
    max-width:640px;
    padding:8vw 7vw;
  }


  .name{
    font-family:'Playfair Display', serif;
    font-weight:700;
    font-style:normal;
    text-transform:uppercase;
    letter-spacing:0.03em;
    font-size:clamp(1.148rem, 2.623vw, 1.476rem);
    margin:0;
    line-height:1.15;
  }


  .tagline{
    display:block;
    font-family:'Playfair Display', serif;
    font-weight:400;
    font-style:italic;
    font-size:clamp(1.05rem, 2.4vw, 1.35rem);
    margin:0.35em 0 0 0;
    line-height:1.3;
  }


  .status{
    margin-top:clamp(3rem, 8vw, 5rem);
  }


  .status p{
    margin:0;
    font-family:'Gabarito', sans-serif;
    font-size:clamp(0.95rem, 1.6vw, 1.05rem);
    line-height:1.6;
  }


  .status .de{
    font-weight:600;
    color:var(--ink);
  }


  .status .en{
    font-weight:400;
    color:var(--muted);
    margin-top:0.35em;
  }


  .contact{
    margin-top:clamp(2rem, 5vw, 3rem);
  }


  .contact a{
    font-family:'Gabarito', sans-serif;
    font-weight:700;
    font-size:clamp(0.95rem, 1.6vw, 1.05rem);
    color:var(--ink);
    text-decoration:none;
  }


  .contact a:hover{
    text-decoration:underline;
  }
</style>
</head>
<body>
<main>
  <p class="name">Regina Fröhlich</p>
  <p class="tagline">Artist · Abstract Painting</p>


  <div class="status">
    <p class="de">Neue Arbeiten in Kürze.</p>
    <p class="en">New work coming soon.</p>
  </div>


  <p class="contact"><a href="mailto:info@reginafroehlich.com">info@reginafroehlich.com</a></p>
</main>
</body>
</html>
